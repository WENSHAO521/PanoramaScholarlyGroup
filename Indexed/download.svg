<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

  <rect width="500" height="500" fill="#FFFFFF"></rect>

  <!-- High-design three-line icon -->
  <g transform="translate(250 165)">
    <!-- Top line -->
    <rect x="-110" y="-24" width="160" height="12" rx="6" fill="#1E2A3A"></rect>

    <!-- Middle line (offset) -->
    <rect x="-70" y="2" width="190" height="12" rx="6" fill="#6A5ACD"></rect>

    <!-- Bottom line (short + offset) -->
    <rect x="-40" y="28" width="120" height="12" rx="6" fill="#2FA36B"></rect>
  </g>

  <!-- Web of Science -->
  <text x="250" y="300" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="600" fill="#1E2A3A" letter-spacing="0.5">
    Web of Science
  </text>

  <!-- Divider -->
  <line x1="150" y1="335" x2="350" y2="335" stroke="#DADDE3" stroke-width="2"></line>

  <!-- Research Commons -->
  <text x="250" y="385" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#6B7280" letter-spacing="1">
    Research Commons
  </text>

</svg>
